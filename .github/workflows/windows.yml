name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: GomjulSplitter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare video tools
        run: |
          python setup_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test splitting engine on Windows
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone application
        run: |
          python -m pip install "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name GomjulSplitter app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools dist/GomjulSplitter/tools -Recurse
      - name: Test actual EXE and window
        run: |
          $report = Join-Path $PWD 'exe-test.json'
          $process = Start-Process -FilePath dist/GomjulSplitter/GomjulSplitter.exe -ArgumentList @('--self-test', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged application test timed out.'
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged application test failed.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Packaged application checks failed.' }
      - name: Prepare download
        run: |
          Remove-Item dist/GomjulSplitter/tools -Recurse -Force
          Copy-Item START_HERE.txt dist/GomjulSplitter/START_HERE.txt
          Copy-Item exe-test.json dist/GomjulSplitter/exe-test.json
      - name: Upload ready-to-run folder
        uses: actions/upload-artifact@v7
        with:
          name: GomjulSplitter-Windows
          path: GomjulSplitter/dist/
          if-no-files-found: error
          retention-days: 14
